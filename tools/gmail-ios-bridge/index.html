<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open in Gmail</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111}
main{max-width:34rem;padding:2rem;text-align:center}
h1{font-size:1.25rem;margin:0 0 .65rem}
p{line-height:1.45;color:#666}
a,button{display:inline-block;margin:.5rem;padding:.85rem 1.1rem;border-radius:12px;border:0;text-decoration:none;font:inherit}
a{background:#0b57d0;color:#fff}
button{background:#eee;color:#111}
@media(prefers-color-scheme:dark){body{background:#000;color:#fff}p{color:#aaa}button{background:#222;color:#fff}}
</style>
</head>
<body>
<main>
<h1>Opening Gmail…</h1>
<p id="status">Trying the exact conversation.</p>
<a id="open" href="#">Open in Gmail</a>
<button id="copy" type="button">Copy fallback search</button>
</main>
<script>
(() => {
  const p = new URLSearchParams(location.hash.replace(/^#/,''));
  const th = p.get('th') || '';
  const account = p.get('a') || '1';
  const q = p.get('q') || '';
  const status = document.getElementById('status');
  const open = document.getElementById('open');
  const copy = document.getElementById('copy');

  if (!/^[0-9a-f]+$/i.test(th) || !/^\d+$/.test(account)) {
    status.textContent = 'Missing or invalid Gmail conversation target.';
    open.hidden = true;
    copy.hidden = true;
    return;
  }

  // Legacy Gmail iOS conversation route. This is materially different from the
  // unsupported /search route: it addresses a concrete Gmail conversation id.
  const gmailUrl = 'googlegmail:///cv=' + encodeURIComponent(th) +
                   '/accountId=' + encodeURIComponent(account) +
                   '&create-new-tab';
  open.href = gmailUrl;

  copy.addEventListener('click', async () => {
    const text = q || ('rfc822msgid:' + th);
    try {
      await navigator.clipboard.writeText(text);
      status.textContent = 'Fallback search copied.';
    } catch {
      status.textContent = 'Fallback search: ' + text;
    }
  });

  setTimeout(() => { location.href = gmailUrl; }, 25);
  setTimeout(() => {
    status.textContent = 'If Gmail did not open automatically, tap Open in Gmail.';
  }, 900);
})();
</script>
</body>
</html>
