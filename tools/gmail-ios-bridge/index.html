<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open in Gmail</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111}
main{max-width:34rem;padding:2rem;text-align:center}
h1{font-size:1.3rem;margin:0 0 .7rem}
p{line-height:1.45;color:#666}
button{display:inline-block;margin:.55rem;padding:.9rem 1.15rem;border-radius:12px;border:0;font:inherit;font-weight:600;background:#0b57d0;color:#fff}
code{display:block;margin:1rem auto;padding:.8rem;border-radius:10px;background:#f2f2f2;word-break:break-all;text-align:left;font-size:.8rem}
#fallback{display:none}
@media(prefers-color-scheme:dark){body{background:#000;color:#fff}p{color:#aaa}code{background:#1d1d1d}}
</style>
</head>
<body>
<main>
<h1>Open in Gmail</h1>
<p>This iPhone Gmail build does not expose a reliable deep link to an arbitrary existing message. This helper copies an exact Gmail search, then opens Gmail.</p>
<button id="go" type="button">Copy search &amp; open Gmail</button>
<div id="fallback">
<p>If the search was not copied, copy this and paste it into Gmail Search:</p>
<code id="query"></code>
</div>
</main>
<script>
(() => {
  const p = new URLSearchParams(location.hash.replace(/^#/,''));
  const q = p.get('q') || '';
  const go = document.getElementById('go');
  const fallback = document.getElementById('fallback');
  const query = document.getElementById('query');

  if (!q || q.length > 1000) {
    go.disabled = true;
    go.textContent = 'Missing Gmail search';
    return;
  }
  query.textContent = q;

  go.addEventListener('click', () => {
    let copied = false;
    try {
      const ta = document.createElement('textarea');
      ta.value = q;
      ta.setAttribute('readonly','');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      copied = document.execCommand('copy');
      ta.remove();
    } catch {}

    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(q).catch(() => {});
    }

    fallback.style.display = copied ? 'none' : 'block';
    window.location.href = 'googlegmail://';
  });
})();
</script>
</body>
</html>
