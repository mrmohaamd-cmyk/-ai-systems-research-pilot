name: Deploy Gmail iOS Bridge

on:
  push:
    branches: [main]
    paths:
      - "tools/gmail-ios-bridge/**"
      - ".github/workflows/gmail-bridge-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gmail-ios-bridge-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload bridge
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/gmail-ios-bridge
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
